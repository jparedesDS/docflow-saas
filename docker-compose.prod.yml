version: "3.8"

# Production overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    environment:
      - ENV=production
      - STORAGE_BACKEND=postgres
      - DATABASE_URL=postgresql://docflow:${POSTGRES_PASSWORD}@postgres:5432/docflow
      - REDIS_URL=redis://redis:6379/0
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
    # Remove dev volume mounts in production
    volumes:
      - docflow-backups:/app/backups
      - docflow-logs:/app/logs

  frontend:
    deploy:
      resources:
        limits:
          memory: 256M
